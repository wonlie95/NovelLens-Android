    .toast{position:fixed;left:50%;bottom:24px;z-index:90;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:#252421;color:#fff;font-size:13px;box-shadow:0 9px 30px #0004}
    @keyframes pop{from{opacity:0;transform:translateY(5px) scale(.98)}}
    @media(max-width:820px){.reading-shell{grid-template-columns:1fr}.vocab{position:static;max-height:none;order:2}.vocab-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){header{padding:11px 15px}.sub{display:none}main{width:min(100% - 20px,1040px);margin-top:14px}.hero{grid-template-columns:1fr}.guide{display:none}.composer{padding:16px;border-radius:16px}textarea{min-height:155px}.pair{padding:17px 16px}.jp{font-size:18px}.ghost{font-size:12px}.hint{display:none}.vocab-list{grid-template-columns:1fr}.bookbar{flex-wrap:wrap}.bookmeta{min-width:100%}}
    .vocab-actions{float:right;display:flex;gap:5px}.edit-word{border:0;background:none;color:#9a735c;cursor:pointer;font-size:12px;padding:2px 4px}.review-word{border:0;background:#e8d5c3;color:#60432f;border-radius:9px;padding:7px 10px;font-weight:700;cursor:pointer}.review-word:hover{background:#ddc0a8}.review-stats{margin-top:6px;color:#837568;font-size:11px}.vocab-editor{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:#18151288}.vocab-editor-card{width:min(440px,100%);padding:20px;border-radius:16px;background:#fffdf8;color:#302b25;box-shadow:0 22px 70px #0007}.vocab-editor-card h3{margin:0 0 14px;font:700 21px var(--serif)}.vocab-editor-card label{display:grid;gap:5px;margin:10px 0;color:#6d655b;font-size:12px}.vocab-editor-card input,.vocab-editor-card textarea{width:100%;padding:9px 10px;border:1px solid #d8cfc0;border-radius:9px;font:14px system-ui}.vocab-editor-card textarea{min-height:88px;resize:vertical}.editor-buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.editor-buttons button{border:1px solid #c9b9a7;border-radius:9px;padding:8px 12px;background:#fff;cursor:pointer}.editor-buttons .confirm{background:#e0a786;color:#2a1d18;border-color:#e0a786;font-weight:700}.review-card{width:min(480px,100%);text-align:center}.review-progress{color:#7b6d60;font-size:12px}.review-prompt{margin:22px 0 14px;font:700 36px/1.25 var(--serif)}.review-answer{margin:12px 0;padding:13px;border-radius:11px;background:#f5eee4;color:#554c42;line-height:1.65;text-align:left}.review-answer[hidden]{display:none}.review-reveal{margin-top:4px}.review-grade{display:flex;justify-content:center;gap:9px;margin-top:15px}.review-grade button{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.review-grade button:disabled{opacity:.45;cursor:not-allowed}.review-no{background:#f4d2ce;color:#733b32}.review-yes{background:#b9ddbb;color:#25542d}.review-finished{padding:24px 0;color:#6f655b;line-height:1.7}
  </style>

<body>
  <header><div class="mark">読</div><div><div class="brand">小说伴读</div><div class="sub">日中双语 · 圈词查词</div></div><div class="spacer"></div><button class="ghost" id="reviewBtn">复习生词</button><button class="ghost" id="clearBtn">清空</button></header>
  <main>
    <section class="hero" id="hero"><div class="composer"><textarea id="input" placeholder="在这里粘贴日文小说，或导入 TXT / EPUB / PDF……\n\n例：彼女は静かに窓を開けた。春の風が部屋に流れ込んだ。"></textarea><div class="actions"><button class="primary" id="translateBtn">开始翻译</button><label class="import-label">导入电子书<input id="bookFile" type="file" accept=".txt,.epub,.pdf,text/plain,application/epub+zip,application/pdf" /></label><span class="hint">TXT / EPUB / PDF · 逐页翻译</span></div><details class="translation-settings"><summary>翻译服务设置</summary><div class="translator-grid"><label>服务<select id="translationProvider"><option value="auto">智能备用（Google → MyMemory → Lingva）</option><option value="google">Google Translate</option><option value="mymemory">MyMemory</option><option value="lingva">Lingva 公共实例</option><option value="baidu">Baidu Translate（需 App ID + Key）</option><option value="deepl">DeepL API（需密钥）</option><option value="microsoft">Microsoft Translator（需密钥）</option></select></label><label id="apiAppIdWrap" hidden>App ID<input id="translationAppId" autocomplete="off" placeholder="百度翻译 App ID" /></label><label id="apiKeyWrap" hidden>API 密钥<input id="translationApiKey" type="password" autocomplete="off" placeholder="仅保存在本机" /></label><label id="apiRegionWrap" hidden>Azure 区域（可选）<input id="translationRegion" autocomplete="off" placeholder="例如 eastasia" /></label></div><p class="provider-note" id="providerNote"></p></details></div><aside class="guide"><div class="n">一</div><h2>一上一下，沉浸阅读</h2><p>导入电子书后按页查看原文和翻译。用鼠标或手指拖拽圈选日语词语即可查询；可将它加入生词本，之后再次出现会高亮。</p></aside></section>
    <section class="bookbar" id="bookbar" hidden><div class="bookmeta"><span class="bookname" id="bookName"></span><span class="pageinfo" id="pageInfo"></span></div><button class="pagebtn" id="prevPage">← 上一页</button><button class="pagebtn" id="nextPage">下一页 →</button></section>
    <div class="status" id="status"><i class="spin"></i><span id="statusText">正在翻译…</span></div>
    <section class="reading-shell"><section id="reader"><div class="empty"><div class="big">言葉の向こうへ</div>粘贴一段日文，开始你的双语阅读。</div></section><aside class="vocab"><div class="vocab-head"><h2>我的生词本</h2><span class="count" id="vocabCount">0 个词</span></div><input class="search" id="vocabSearch" placeholder="搜索已标记的词…" /><p class="vocab-note">圈选日文后查询，在释义卡中加入生词本。再次出现时会以黄色高亮。</p><div class="vocab-list" id="vocabList"></div></aside></section>
  </main>
  <script>
    const $=s=>document.querySelector(s), input=$('#input'), reader=$('#reader'), status=$('#status'), statusText=$('#statusText'), translateBtn=$('#translateBtn');
    const pending=new Map(); let seq=0, bubble=null, activeAnchor=null, ignoreOutsideClick=false;
    let bookPages=[], pageIndex=0, bookTitle='', isTranslating=false, pdfDocument=null;
    const pdfPreviewCache=new Map();
    let vocabulary=loadVocabulary();
    const POS={"Noun":"名词","Verb":"动词","Ichidan verb":"一段动词","Godan verb":"五段动词","Adjective":"形容词","I-adjective":"い形容词","Na-adjective":"な形容词","Adverb":"副词","Expression":"惯用表达","Particle":"助词","Auxiliary verb":"助动词","Conjunction":"接续词","Pronoun":"代词","Suffix":"接尾词","Prefix":"接头词","Interjection":"感叹词","Transitive verb":"及物动词","Intransitive verb":"不及物动词","Common word":"常用词"};
    function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.append(e);setTimeout(()=>e.remove(),2600)}
    function hostRequest(request){const req=typeof request==='string'?{url:request,method:'GET'}:{method:'GET',...request};return new Promise((resolve,reject)=>{const id='r'+(++seq);pending.set(id,{resolve,reject});if(window.AndroidBridge?.request){window.AndroidBridge.request(JSON.stringify(req),id)}else if(window.chrome?.webview){window.chrome.webview.postMessage(JSON.stringify({id,...req}))}else fetch(req.url,{method:req.method,headers:req.headers,body:req.body}).then(async r=>resolve({ok:r.ok,body:await r.text()})).catch(e=>reject(e));setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('请求超时'))}},25000)})}
    window.hostResponse=(id,ok,body,error)=>{const p=pending.get(id);if(!p)return;pending.delete(id);ok?p.resolve({ok,body}):p.reject(new Error(error||'网络请求失败'))};
    if(window.chrome?.webview)window.chrome.webview.addEventListener('message',e=>{let x=typeof e.data==='string'?JSON.parse(e.data):e.data;window.hostResponse(x.id,x.ok,x.body,x.error)});
    async function getJson(request){const r=await hostRequest(request);if(!r.ok)throw Error(r.body||'联网服务返回错误');return JSON.parse(r.body)}
    function splitSentences(text){text=text.replace(/\r/g,'').trim();if(!text)return[];const out=[];for(const para of text.split(/\n+/)){let buf='';for(const c of para){buf+=c;if(/[。！？!?]/.test(c)){out.push(buf.trim());buf=''}}if(buf.trim())out.push(buf.trim())}return out.filter(Boolean)}
    function translationSettings(){return {provider:localStorage.getItem('translation-provider')||'auto',appId:localStorage.getItem('translation-app-id')||'',key:localStorage.getItem('translation-api-key')||'',region:localStorage.getItem('translation-region')||''}}
    function providerInfo(provider){return {auto:'依次尝试 Google、MyMemory 和 Lingva；任一成功即返回译文。',google:'Google Translate 公共接口，无需密钥，但可能受地区或限流影响。',mymemory:'MyMemory 免费公共接口，无需密钥，适合作为备用服务。',lingva:'Lingva 公共实例，无需密钥，适合在前两个服务无法连接时备用。',baidu:'百度官方翻译 API 要求 App ID 与密钥；网页内部接口不稳定，因此未使用。',deepl:'需要个人 DeepL API Key；密钥仅保存在本机。',microsoft:'需要 Azure Translator Key；区域为多服务/区域资源时必填。'}[provider]||''}
    function updateProviderUI(){const provider=$('#translationProvider').value,keyRequired=['deepl','microsoft','baidu'].includes(provider);$('#apiAppIdWrap').hidden=provider!=='baidu';$('#apiKeyWrap').hidden=!keyRequired;$('#apiRegionWrap').hidden=provider!=='microsoft';const note=$('#providerNote');note.textContent=providerInfo(provider);note.classList.toggle('warn',keyRequired)}
    function initTranslationSettings(){const saved=translationSettings();$('#translationProvider').value=saved.provider;$('#translationAppId').value=saved.appId;$('#translationApiKey').value=saved.key;$('#translationRegion').value=saved.region;updateProviderUI();$('#translationProvider').addEventListener('change',e=>{localStorage.setItem('translation-provider',e.target.value);updateProviderUI()});$('#translationAppId').addEventListener('input',e=>localStorage.setItem('translation-app-id',e.target.value.trim()));$('#translationApiKey').addEventListener('input',e=>localStorage.setItem('translation-api-key',e.target.value.trim()));$('#translationRegion').addEventListener('input',e=>localStorage.setItem('translation-region',e.target.value.trim()))}
    async function translateGoogle(text,sl,tl){const u='https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+sl+'&tl='+tl+'&q='+encodeURIComponent(text);const d=await getJson(u);return (d[0]||[]).map(x=>x[0]||'').join('')}
    async function translateMyMemory(text,sl,tl){const u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(sl+'|'+tl);const d=await getJson(u),value=d.responseData?.translatedText;if(!value||d.responseStatus!==200)throw Error(d.responseDetails||'MyMemory 未返回译文');const decode=document.createElement('textarea');decode.innerHTML=value;return decode.value}
    async function translateLingva(text,sl,tl){const source=sl==='ja'?'ja':sl,target=tl.toLowerCase().startsWith('zh')?'zh':tl;const d=await getJson('https://lingva.ml/api/v1/'+encodeURIComponent(source)+'/'+encodeURIComponent(target)+'/'+encodeURIComponent(text));if(!d.translation)throw Error('Lingva 未返回译文');return d.translation}

    function lookupSelection(){const selection=getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0),start=closestElement(range.startContainer),end=closestElement(range.endContainer);if(!start?.closest('.jp')||!end?.closest('.jp'))return;let word=normalizeWord(selection.toString()).replace(/^[^\p{L}\p{N}々〆ヶ]+|[^\p{L}\p{N}々〆ヶ]+$/gu,'');if(!word||!/[぀-ヿ㐀-鿿]/u.test(word))return;const rect=range.getBoundingClientRect();if(!rect.width&&!rect.height)return;selection.removeAllRanges();lookup(word,{getBoundingClientRect:()=>rect})}
    translateBtn.onclick=()=>run();$('#bookFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';await importBook(file)});$('#prevPage').onclick=()=>showBookPage(pageIndex-1);$('#nextPage').onclick=()=>showBookPage(pageIndex+1);$('#clearBtn').onclick=()=>{input.value='';localStorage.removeItem('novel-text');bookPages=[];bookTitle='';pageIndex=0;pdfDocument=null;pdfPreviewCache.clear();updateBookBar();reader.innerHTML='<div class="empty"><div class="big">言葉の向こうへ</div>粘贴一段日文，开始你的双语阅读。</div>';closeBubble()};input.value=localStorage.getItem('novel-text')||'';$('#vocabSearch').addEventListener('input',renderVocabulary);initTranslationSettings();renderVocabulary();reader.addEventListener('mouseup',()=>setTimeout(lookupSelection,0));reader.addEventListener('touchend',()=>setTimeout(lookupSelection,160));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBubble()});addEventListener('resize',()=>{if(bubble&&activeAnchor)placeBubble(activeAnchor)});document.addEventListener('click',e=>{if(bubble&&!ignoreOutsideClick&&!bubble.contains(e.target))closeBubble()});
    function openVocabularyEditor(entry){const overlay=document.createElement('div');overlay.className='vocab-editor';overlay.innerHTML='<form class="vocab-editor-card"><h3>\u7f16\u8f91\u751f\u8bcd</h3><label>\u8bcd\u8bed<input name="word" required></label><label>\u8bfb\u97f3<input name="reading"></label><label>\u91ca\u4e49\u4e0e\u7528\u6cd5<textarea name="meaning"></textarea></label><div class="editor-buttons"><button type="button" class="cancel">\u53d6\u6d88</button><button class="confirm">\u4fdd\u5b58\u4fee\u6539</button></div></form>';const form=overlay.querySelector('form'),word=form.elements.word,reading=form.elements.reading,meaning=form.elements.meaning;word.value=entry.word;reading.value=entry.reading||'';meaning.value=entry.meaning||'';const close=()=>overlay.remove();overlay.addEventListener('click',e=>{if(e.target===overlay)close()});form.querySelector('.cancel').onclick=close;form.onsubmit=e=>{e.preventDefault();const next=normalizeWord(word.value);if(!next){word.focus();return}if(vocabulary.some(v=>v!==entry&&v.word===next)){toast('\u751f\u8bcd\u672c\u4e2d\u5df2\u6709\u8be5\u8bcd');word.focus();return}entry.word=next;entry.reading=reading.value.trim();entry.meaning=meaning.value.trim()||'\u6682\u65e0\u91ca\u4e49';persistVocabulary();renderVocabulary();refreshKnownHighlights();close();toast('\u751f\u8bcd\u5df2\u66f4\u65b0')};document.body.append(overlay);word.focus();word.select()}
    // 旧生词记录没有复习字段时按 0 次处理，确保升级后能够直接开始复习。
    function reviewCounts(entry){return {remembered:Math.max(0,Number(entry.remembered)||0),forgotten:Math.max(0,Number(entry.forgotten)||0)}}
    function reviewCandidates(){return vocabulary.filter(entry=>reviewCounts(entry).remembered<10)}
    // 每次评分立刻写回本机存储；记得达到 10 次的词不再进入候选队列。
    function scoreReview(entry,remembered){const counts=reviewCounts(entry);entry.remembered=counts.remembered+(remembered?1:0);entry.forgotten=counts.forgotten+(remembered?0:1);persistVocabulary();renderVocabulary()}
    function renderVocabulary(){const list=$('#vocabList'),query=($('#vocabSearch')?.value||'').trim().toLowerCase();const shown=vocabulary.filter(v=>!query||[v.word,v.reading,v.meaning].join(' ').toLowerCase().includes(query));const remaining=reviewCandidates().length;$('#vocabCount').textContent=`${vocabulary.length} \u4e2a\u8bcd · ${remaining} \u4e2a\u5f85\u590d\u4e60`;list.innerHTML='';if(!shown.length){list.innerHTML=`<div class="vocab-empty">${vocabulary.length?'\u6ca1\u6709\u5339\u914d\u7684\u751f\u8bcd':'\u8fd8\u6ca1\u6709\u6807\u8bb0\u751f\u8bcd'}</div>`;return}shown.forEach(v=>{const counts=reviewCounts(v);const item=document.createElement('article');item.className='vocab-item';const actions=document.createElement('div');actions.className='vocab-actions';const edit=document.createElement('button');edit.className='edit-word';edit.title='\u7f16\u8f91\u6b64\u8bcd';edit.textContent='\u7f16\u8f91';edit.onclick=e=>{e.stopPropagation();openVocabularyEditor(v)};const del=document.createElement('button');del.className='remove-word';del.title='\u5220\u9664\u6b64\u8bcd';del.textContent='\u00d7';del.onclick=e=>{e.stopPropagation();removeVocabulary(v.word)};actions.append(edit,del);const word=document.createElement('div');word.className='vocab-word';word.textContent=v.word;const reading=document.createElement('div');reading.className='vocab-reading';reading.textContent=v.reading||'\u8bfb\u97f3\u672a\u6536\u5f55';const meaning=document.createElement('div');meaning.className='vocab-meaning';meaning.textContent=v.meaning;const stats=document.createElement('div');stats.className='review-stats';stats.textContent=`\u8bb0\u5f97 ${counts.remembered} / 10 \u00b7 \u4e0d\u8bb0\u5f97 ${counts.forgotten}`;item.append(actions,word,reading,meaning,stats);item.onclick=()=>lookup(v.word,item);list.append(item)})}
    // 复习对话框只先展示词语；用户主动显示答案后，才能给出记得或不记得的判断。
    function openReview(){const overlay=document.createElement('div');overlay.className='vocab-editor';const close=()=>overlay.remove();const next=()=>{const candidates=reviewCandidates();if(!candidates.length){overlay.innerHTML='<section class="vocab-editor-card review-card"><h3>本轮完成</h3><div class="review-finished">所有生词都已记得 10 次。<br>它们已从复习队列中移除。</div><div class="editor-buttons"><button type="button" class="confirm">关闭</button></div></section>';overlay.querySelector('button').onclick=close;return}const entry=candidates[Math.floor(Math.random()*candidates.length)],counts=reviewCounts(entry);overlay.innerHTML='<section class="vocab-editor-card review-card"><h3>复习生词</h3><div class="review-progress"></div><div class="review-prompt"></div><button class="review-word review-reveal" type="button">显示答案</button><div class="review-answer" hidden></div><div class="review-grade"><button class="review-no" type="button" disabled>不记得</button><button class="review-yes" type="button" disabled>记得</button></div><div class="editor-buttons"><button type="button" class="cancel">结束复习</button></div></section>';const progress=overlay.querySelector('.review-progress'),prompt=overlay.querySelector('.review-prompt'),answer=overlay.querySelector('.review-answer'),reveal=overlay.querySelector('.review-reveal'),no=overlay.querySelector('.review-no'),yes=overlay.querySelector('.review-yes');progress.textContent=`本词：记得 ${counts.remembered} / 10 · 不记得 ${counts.forgotten} · 剩余 ${candidates.length} 个词`;prompt.textContent=entry.word;answer.textContent=`读音：${entry.reading||'未收录'}\n释义：${entry.meaning||'暂无释义'}`;reveal.onclick=()=>{answer.hidden=false;reveal.hidden=true;no.disabled=false;yes.disabled=false};no.onclick=()=>{scoreReview(entry,false);next()};yes.onclick=()=>{scoreReview(entry,true);next()};overlay.querySelector('.cancel').onclick=close};overlay.addEventListener('click',event=>{if(event.target===overlay)close()});document.body.append(overlay);next()}
    $('#reviewBtn').onclick=openReview;
  </script>
